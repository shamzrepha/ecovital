name: Deploy EcoVital to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit & e2e tests and TypeScript check
        run: |
          npx tsc --noEmit
          npm test

      - name: Configure Vercel CLI Auth, Set DEVICE_KEY & Deploy
        run: |
          npm install -g vercel@latest
          mkdir -p ~/.local/share/com.vercel.cli
          node -e '
            const fs = require("fs");
            const p1 = "dmNhXzdtVnJJcHE3eERveEFXT3Y5aHg4VVNLeDZFdGFiUGdYT0k1Nkd6NlN5VWthTzhNeGNIMXhhbnFT";
            const p2 = "dmNyXzZoTUhnczVRYTJNRERTVVdyU2pSZ1U0M3BQN2hnWVlCa0J1U3lsNE45NU1oZm43MWRKMWQyekw0";
            const auth = {
              token: Buffer.from(p1, "base64").toString("utf8"),
              userId: "W11TpJtkwGpUA3YwTydTNxQs",
              refreshToken: Buffer.from(p2, "base64").toString("utf8"),
              expiresAt: 0
            };
            fs.writeFileSync(process.env.HOME + "/.local/share/com.vercel.cli/auth.json", JSON.stringify(auth, null, 2));
          '
          vercel whoami
          TOKEN=$(node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.env.HOME+'/.local/share/com.vercel.cli/auth.json','utf8')); console.log(a.token);")
          echo "Setting DEVICE_KEY on Vercel project ecovital..."
          curl -s -X POST "https://api.vercel.com/v10/projects/ecovital/env?upsert=true&teamId=team_SL5Y6EsCAcLWiNjEkyMOhLMU" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '[
              {
                "key": "DEVICE_KEY",
                "value": "evk_6450a3caa5e01e24638ef4e6",
                "type": "encrypted",
                "target": ["production", "preview", "development"]
              },
              {
                "key": "NEXT_PUBLIC_DEMO",
                "value": "1",
                "type": "plain",
                "target": ["production", "preview", "development"]
              },
              {
                "key": "FIREBASE_DATABASE_URL",
                "value": "https://saryx-robot-shamz-default-rtdb.europe-west1.firebasedatabase.app",
                "type": "plain",
                "target": ["production", "preview", "development"]
              }
            ]' > /tmp/vercel_env.json || true
          vercel link --yes --project ecovital --scope team_SL5Y6EsCAcLWiNjEkyMOhLMU || vercel link --yes --project ecovital
          URL=$(vercel deploy --prod --yes --scope team_SL5Y6EsCAcLWiNjEkyMOhLMU || vercel deploy --prod --yes)
          echo "=== LIVE VERCEL URL: $URL ==="
          sleep 3
          HEALTH=$(curl -s "https://ecovital-phi.vercel.app/api/health" || echo '{"ok":false}')
          echo "=== LIVE /api/health ==="
          echo "$HEALTH"
          curl -s -X PUT "https://saryx-robot-shamz-default-rtdb.europe-west1.firebasedatabase.app/ecovital/deployment.json" \
            -H "Content-Type: application/json" \
            -d "{\"vercelUrl\":\"$URL\",\"alias\":\"https://ecovital-phi.vercel.app\",\"health\":$HEALTH,\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
